name: Interactive Mac Shell

on:
  workflow_dispatch: # Allows you to manually click "Run workflow"

jobs:
  build:
    runs-on: macos-latest # This provisions a real macOS VM
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false # Set to true if you only want your own GitHub SSH keys to have access
