name: Native Mac SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SSH via P3TERX Action
        uses: P3TERX/ssh-action@vnlp
        with:
          # Injects your public key directly into the Mac runner's authorized_keys
          ssh-public-key: ${{ secrets.MY_SSH_PUBLIC_KEY }}
          # Keeps the workflow alive until you disconnect or timeout
          required-sudo: true
