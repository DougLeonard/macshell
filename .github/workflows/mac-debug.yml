name: Native Mac SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Native SSH & Inject Key
        run: |
          sudo systemsetup -setremotelogin on
          
          # Set up proper ownership and locked-down permissions
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_SSH_PUBLIC_KEY }}" > ~/.ssh/authorized_keys
          
          sudo chown -R runner:staff /Users/runner/.ssh
          chmod 700 /Users/runner/.ssh
          chmod 600 /Users/runner/.ssh/authorized_keys
          
          # Disable StrictModes so macOS doesn't drop automated runner keys
          sudo bash -c 'echo "StrictModes no" >> /etc/ssh/sshd_config'
          sudo launchctl kickstart -k system/com.openssh.sshd

          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" >> ~/.ssh/config

          echo "=== STARTING TUNNEL ==="
          ssh -p 443 -R0:localhost:22 tcp@free.pinggy.io &
          sleep 900
