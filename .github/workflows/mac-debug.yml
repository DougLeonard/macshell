name: Native Mac SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Native SSH & Inject Key
        run: |
          sudo systemsetup -setremotelogin on
          mkdir -p ~/.ssh
          # Explicitly paste your exact public key string here or via secret:
          echo "AAAAC3NzaC1lZDI1NTE5AAAAIMa6qW+Bmp+SB2zPoxEZPF980oYxNOVZORIFPLEkl35v" > ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo chown -R runner:staff ~/.ssh

          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" >> ~/.ssh/config

          echo "=== STARTING TUNNEL ==="
          ssh -p 443 -R0:localhost:22 tcp@free.pinggy.io &
          sleep 900
