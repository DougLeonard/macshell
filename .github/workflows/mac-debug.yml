name: Native Mac SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SSH Session
        uses: lexbritvin/ssh-session-action@v1
        with:
          use-actor-ssh-keys: true
          # Uses public jump hosts (like pinggy or serveo) to route the tunnel cleanly
          ssh-jump-host: 'free.pinggy.io'
          ssh-jump-port: '443'
          ssh-jump-user: 'tcp'
          ssh-jump-forward: '0'
